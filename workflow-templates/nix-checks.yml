name: Nix checks
on:
  pull_request:
  push:
    branches: [$default-branch]
  merge_group:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  discover:
    name: Discover CI inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lockfiles: ${{ steps.inventory.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inventory
        uses: nix-forge/ci/actions/discover-lockfiles@bb1b39a9082f72dc6c7ce596103ce7a5e4d29b01 # v2.8.0
  lock-health:
    name: Flake lock health
    needs: [lock]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every discovered lockfile to pass
        env:
          LOCK_RESULT: ${{ needs.lock.result }}
        run: test "$LOCK_RESULT" = success
  lock:
    needs: [discover]
    name: Flake lock health (${{ matrix.lockfile }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile: ${{ fromJSON(needs.discover.outputs.lockfiles) }}
    uses: nix-forge/ci/.github/workflows/flake-lock.yml@bb1b39a9082f72dc6c7ce596103ce7a5e4d29b01 # v2.8.0
    with:
      lockfile: ${{ matrix.lockfile }}
  checks:
    name: Nix checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@bb1b39a9082f72dc6c7ce596103ce7a5e4d29b01 # v2.8.0
      - name: Validate workflow contracts
        uses: nix-forge/ci/actions/validate-workflows@bb1b39a9082f72dc6c7ce596103ce7a5e4d29b01 # v2.8.0
      - name: Materialize discovered partitions
        uses: nix-forge/ci/actions/materialize-partitions@bb1b39a9082f72dc6c7ce596103ce7a5e4d29b01 # v2.8.0
      - name: Run declared repository checks
        run: nix flake check --keep-going --print-build-logs
