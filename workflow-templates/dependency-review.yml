name: Dependency review
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions: {}
concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  review:
    name: Dependency review
    permissions:
      contents: read
    uses: nix-forge/ci/.github/workflows/dependency-review.yml@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
