name: Dependency review
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions: {}
concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  review:
    name: Dependency review
    permissions:
      contents: read
    uses: nix-forge/ci/.github/workflows/dependency-review.yml@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
