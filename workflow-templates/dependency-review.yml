name: Dependency review
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions: {}
concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  review:
    name: Dependency review
    permissions:
      contents: read
    uses: nix-forge/ci/.github/workflows/dependency-review.yml@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
