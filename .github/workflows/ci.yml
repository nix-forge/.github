name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@679f99ac3b2c8e25d2b2049c1b21541c51dc71ee # v1.0.2
      - name: Validate workflow templates
        run: nix develop github:nix-forge/ci/679f99ac3b2c8e25d2b2049c1b21541c51dc71ee --command actionlint .github/workflows/*.yml workflow-templates/*.yml
      - name: Validate template metadata
        run: python3 -c 'import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path("workflow-templates").glob("*.json")]'
