name: CI
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@b5ec655589b52df24c9b38d20a6b4bf364ec35cc # v2.5.4
      - name: Validate workflows and template contracts
        uses: nix-forge/ci/actions/validate-workflows@b5ec655589b52df24c9b38d20a6b4bf364ec35cc # v2.5.4
  dependency-review:
    name: dependency-review / review
    if: github.event_name != 'push'
    permissions:
      contents: read
    uses: nix-forge/ci/.github/workflows/dependency-review.yml@b5ec655589b52df24c9b38d20a6b4bf364ec35cc # v2.5.4
  codeql:
    name: CodeQL
    permissions:
      actions: read # Read workflow metadata for Actions analysis.
      contents: read
      security-events: write # Upload code scanning results.
    uses: nix-forge/ci/.github/workflows/codeql.yml@b5ec655589b52df24c9b38d20a6b4bf364ec35cc # v2.5.4
    with:
      languages: actions
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/', github.event.repository.default_branch))
    needs: [validate, dependency-review, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Notify the trusted default-branch reconciler.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@b5ec655589b52df24c9b38d20a6b4bf364ec35cc # v2.5.4
