name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@a75d21dababfd55145e2df1db81f3d2d865bec59 # v1.0.1
      - name: Validate workflow templates
        run: nix develop github:nix-forge/ci/a75d21dababfd55145e2df1db81f3d2d865bec59 --command actionlint workflow-templates/*.yml
      - name: Validate template metadata
        run: python3 -c 'import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path("workflow-templates").glob("*.json")]'
