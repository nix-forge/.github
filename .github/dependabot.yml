version: 2
updates:
  - package-ecosystem: github-actions
    directories: [/, /workflow-templates]
    schedule:
      interval: weekly
    groups:
      shared-ci:
        patterns: ["nix-forge/ci", "nix-forge/ci/*"]
        exclude-patterns:
          - "nix-forge/ci/.github/workflows/slsa-*"
          - "nix-forge/ci/actions/repository-checks"
        # Shared workflow references are validated as one release commit.
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
