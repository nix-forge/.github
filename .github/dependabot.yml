version: 2
updates:
  - package-ecosystem: github-actions
    directories: [/, /workflow-templates]
    schedule:
      interval: weekly
    groups:
      shared-ci:
        patterns: [nix-forge/ci]
        # Shared workflow references are validated as one release commit.
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
